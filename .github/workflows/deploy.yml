name: Build and deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: restaurant-pos-production
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://post.vegtrixgroup.com/api
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Test backend
        run: pnpm --dir backend check

      - name: Check frontend types and lint
        run: |
          pnpm --dir frontend typecheck
          pnpm --dir frontend lint

      - name: Validate frontend API URL
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "Production API URL must be https://post.vegtrixgroup.com/api."
            exit 1
          fi
          case "$NEXT_PUBLIC_API_URL" in
            https://*/api) ;;
            *)
              echo "NEXT_PUBLIC_API_URL must be an HTTPS URL ending in /api."
              exit 1
              ;;
          esac

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Package release
        run: |
          tar \
            --exclude='backend/node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/.next/cache' \
            --exclude='backend/.env*' \
            --exclude='frontend/.env*' \
            -czf "$RUNNER_TEMP/restaurant-pos-${GITHUB_SHA}.tar.gz" \
            backend frontend ecosystem.config.cjs

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: restaurant-pos-${{ github.sha }}
          path: ${{ runner.temp }}/restaurant-pos-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to application VM
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      FRONTEND_ORIGIN: https://post.vegtrixgroup.com
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: restaurant-pos-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Verify deployment configuration
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "Configure the $name repository variable."
              exit 1
            fi
          done
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Configure the DEPLOY_KNOWN_HOSTS repository secret."
            exit 1
          fi

      - name: Configure pinned host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Install, activate, and verify release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          artifact="$RUNNER_TEMP/release/restaurant-pos-${RELEASE_SHA}.tar.gz"
          remote_artifact="/tmp/restaurant-pos-${RELEASE_SHA}.tar.gz"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          test -s "$artifact"
          scp "$artifact" "${target}:${remote_artifact}"

          printf -v remote_args '%q ' \
            "$DEPLOY_PATH" \
            "$RELEASE_SHA" \
            "$remote_artifact" \
            "$FRONTEND_ORIGIN"
          ssh "$target" "bash -s -- ${remote_args}" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          deploy_path=${1:?DEPLOY_PATH argument is required}
          release_sha=${2:?Release SHA argument is required}
          artifact_path=${3:?Release artifact argument is required}
          frontend_origin=${4:?FRONTEND_ORIGIN argument is required}

          if [[ ! "$deploy_path" =~ ^/opt/apps/[a-zA-Z0-9._-]+$ || "$deploy_path" == "/opt/apps/." || "$deploy_path" == "/opt/apps/.." ]]; then
            echo "DEPLOY_PATH must be a dedicated application directory under /opt/apps." >&2
            exit 1
          fi

          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release identifier must be a full Git commit SHA." >&2
            exit 1
          fi

          if [[ ! "$frontend_origin" =~ ^https://[^/]+$ ]]; then
            echo "FRONTEND_ORIGIN must be the exact HTTPS frontend origin." >&2
            exit 1
          fi

          backend_env_file="/etc/apps/restaurant-post-supabase/restaurant-post-supabase.env"
          release_directory="$deploy_path/releases/$release_sha"
          current_link="$deploy_path/current"

          for command_name in node pnpm pm2 curl tar; do
            if ! command -v "$command_name" >/dev/null 2>&1; then
              echo "Required command is missing on the VM: $command_name" >&2
              exit 1
            fi
          done

          if [[ "$(node -p 'process.versions.node.split(".")[0]')" -lt 24 ]]; then
            echo "Node.js 24 or newer is required on the VM." >&2
            exit 1
          fi

          if [[ ! -s "$backend_env_file" || ! -r "$backend_env_file" ]]; then
            echo "Create $backend_env_file and ensure the deployment user can read it before deployment." >&2
            exit 1
          fi

          mkdir -p "$deploy_path/releases"
          mkdir -p "$release_directory"
          tar -xzf "$artifact_path" -C "$release_directory"
          ln -sfn -- "$backend_env_file" "$release_directory/backend/.env"

          pnpm --dir "$release_directory/backend" install --prod --frozen-lockfile
          pnpm --dir "$release_directory/frontend" install --prod --frozen-lockfile

          pnpm --dir "$release_directory/backend" migrate

          previous_release=""
          if [[ -L "$current_link" ]]; then
            previous_release=$(readlink -f "$current_link")
          fi

          activate_release() {
            local target=$1
            local temporary_link="$deploy_path/current.next"
            rm -f "$temporary_link"
            ln -s "$target" "$temporary_link"
            mv -Tf "$temporary_link" "$current_link"
          }

          start_release() {
            local release=$1

            for app_name in restaurant-pos-backend restaurant-pos-frontend; do
              if pm2 describe "$app_name" >/dev/null 2>&1; then
                pm2 delete "$app_name" || return 1
              fi
            done

            CORS_ORIGINS="$frontend_origin" pm2 start "$release/ecosystem.config.cjs" --env production --update-env || return 1
            pm2 jlist | EXPECTED_RELEASE="$release" node -e '
              let output = ""
              process.stdin.setEncoding("utf8")
              process.stdin.on("data", (chunk) => { output += chunk })
              process.stdin.on("end", () => {
                const apps = JSON.parse(output)
                const expected = process.env.EXPECTED_RELEASE
                const expectedApps = new Map([
                  ["restaurant-pos-backend", `${expected}/backend`],
                  ["restaurant-pos-frontend", `${expected}/frontend`],
                ])
                for (const [name, cwd] of expectedApps) {
                  const app = apps.find((entry) => entry.name === name)
                  if (!app || app.pm2_env.status !== "online" || app.pm2_env.pm_cwd !== cwd) {
                    console.error(`PM2 did not start ${name} from the new release.`)
                    process.exitCode = 1
                    return
                  }
                }
              })
            '
          }

          rollback() {
            if [[ -n "$previous_release" ]]; then
              echo "Rolling back to the previous release." >&2
              activate_release "$previous_release"
              if ! start_release "$previous_release"; then
                echo "Could not restart the previous release automatically." >&2
              fi
            else
              echo "No previous release exists; stop the failed first deployment manually if needed." >&2
            fi
          }

          activate_release "$release_directory"
          if ! start_release "$release_directory"; then
            rollback
            exit 1
          fi

          backend_ready=false
          frontend_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --header "Origin: $frontend_origin" \
              http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
              backend_ready=true
            fi

            if curl --fail --silent http://127.0.0.1:3002/ >/dev/null 2>&1; then
              frontend_ready=true
            fi

            if [[ "$backend_ready" == true && "$frontend_ready" == true ]]; then
              break
            fi
            sleep 2
          done

          if [[ "$backend_ready" != true || "$frontend_ready" != true ]]; then
            echo "Health check failed for the new release." >&2
            rollback
            exit 1
          fi

          pm2 save
          rm -f "$artifact_path"
          echo "Deployed release $release_sha successfully."
          REMOTE_SCRIPT
